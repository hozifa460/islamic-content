name: 24/7 Automated YouTube Channel Sync

on:
  schedule:
    - cron: '0 * * * *'   # Runs automatically every 1 hour 24/7
  workflow_dispatch:      # Allows manual trigger anytime from GitHub UI

jobs:
  youtube-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Run 24/7 YouTube Auto Sync
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python tools/sync_youtube.py
